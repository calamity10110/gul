name: GUL CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# ⚡ Bolt: Cancel redundant builds on PRs to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build and test both compilers
  compilers:
    name: Build & Test Compilers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gul_stable, gul_nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ⚡ Bolt: Use robust rust caching to avoid recompiling from scratch
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.compiler }}
      - name: Build ${{ matrix.compiler }}
        run: cargo build -p ${{ matrix.compiler }} --release

      - name: Test ${{ matrix.compiler }}
        # ⚡ Bolt: Run tests in release mode to reuse artifacts from the previous build step and save CI time
        run: cargo test -p ${{ matrix.compiler }} --release

      # ⚡ Bolt: Combine tests to avoid recompiling from scratch and saving CI minutes
      - name: Shared Sanity Tests
        run: |
          # ⚡ Bolt: Removed redundant `cargo build` here to save CI time; already built above
          if [ "${{ matrix.compiler }}" == "gul_nightly" ]; then
            ./target/release/gul-compile compilers/shared/tests/sanity_check.mn -o sanity_nightly
            ./sanity_nightly
          elif [ "${{ matrix.compiler }}" == "gul_stable" ]; then
            ./target/release/gul-compile compilers/stable/tests/sanity_check.mn -o sanity_stable
            ./sanity_stable
            ./target/release/gul-compile compilers/stable/tests/arithmetic.mn -o arith_stable
            ./arith_stable
          fi

      # ⚡ Bolt: Run nightly-specific tests here to prevent a third redundant build
      - name: Nightly Integration Tests
        if: matrix.compiler == 'gul_nightly'
        continue-on-error: true
        run: |
          # ⚡ Bolt: Removed redundant `cargo build` here to save CI time; already built above
          cd compilers/nightly
          python3 tests/run_tests.py

  # Lint and format check
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # ⚡ Bolt: Use robust rust caching to avoid recompiling from scratch
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check format
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true
