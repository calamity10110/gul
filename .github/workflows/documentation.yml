name: Documentation Automation

on:
  push:
    branches: [main, master, develop]
    paths:
      - "docs/**"
      - "src_bootstrap/**"
      - "packages/**"
  pull_request:
    paths:
      - "docs/**"
  schedule:
    # Update docs daily at 4 AM UTC
    - cron: "0 4 * * *"

# ⚡ Bolt: Cancel redundant builds on PRs to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

jobs:
  # ⚡ Bolt: Fold documentation jobs into a single pipeline to avoid redundant CI build times
  documentation-pipeline:
    name: Documentation Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev xvfb imagemagick

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ⚡ Bolt: Use robust rust caching to avoid recompiling from scratch
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-latest

      - name: Build GUL Compiler
        run: cargo build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install -g markdownlint-cli markdown-link-check || true

      - name: Check markdown formatting
        run: markdownlint 'docs/**/*.md' || true

      - name: Validate links
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --verbose --no-progress 'docs/**/*.md'

      - name: Validate code examples
        run: python scripts/ci/validate_code_examples.py || echo "Code example validation skipped or failed"

      - name: Check for broken cross-references
        run: python scripts/ci/check_doc_references.py || echo "Cross-reference check skipped or failed"

      - name: Generate Rust API docs
        run: cargo doc --no-deps --all-features --document-private-items

      - name: Generate GUL stdlib docs
        run: |
          ./target/debug/gul doc --all-packages --output docs/api/generated || echo "gul doc subcommand not yet implemented, skipping"

      - name: Generate package API docs
        run: python scripts/ci/generate_package_api_docs.py || echo "Package API doc generation skipped"

      - name: Ensure API docs directory exists
        run: mkdir -p docs/api/generated

      - name: Upload API docs
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: docs/api/generated
          if-no-files-found: ignore

      - name: Generate CLI screenshots
        run: |
          if [ -f "scripts/ci/generate_cli_screenshots.py" ]; then
            xvfb-run python scripts/ci/generate_cli_screenshots.py || echo "CLI screenshot generation failed"
          else
            echo "generate_cli_screenshots.py not found, skipping"
          fi

      - name: Generate TUI screenshots
        run: |
          if [ -f "scripts/ci/generate_tui_screenshots.py" ]; then
            xvfb-run python scripts/ci/generate_tui_screenshots.py || echo "TUI screenshot generation failed"
          else
            echo "generate_tui_screenshots.py not found, skipping"
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-screenshots
          path: docs/assets/screenshots
          if-no-files-found: ignore

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin
          pip install pymdown-extensions pygments

      - name: Build documentation site
        run: mkdocs build || true

      - name: Test documentation site
        run: |
          if [ -d "tests/docs" ]; then
            pip install pytest pytest-html
            pytest tests/docs/
          else
            echo "tests/docs/ not found, skipping doc tests"
          fi

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: docs.gul-lang.org

      - name: Deploy to documentation server
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          # rsync -avz --delete site/ user@docs-server:/var/www/docs/
          echo "Deploy to custom server (configure as needed)"

      - name: Generate changelog
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: python scripts/ci/generate_changelog.py || echo "Changelog generation skipped"

      - name: Update CHANGES.md
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGES.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update changelog [skip ci]"
          git push
