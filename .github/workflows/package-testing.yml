name: Package Ecosystem Testing

on:
  push:
    paths:
      - "packages/**"
      - "gul_packages/**"
      - "Cargo.toml"
  pull_request:
    paths:
      - "packages/**"
      - "gul_packages/**"
  schedule:
    # Run daily at 3 AM UTC
    - cron: "0 3 * * *"

jobs:
  # Validate all packages
  validate-packages:
    name: Validate Package Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUL Compiler
        run: cargo build --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install toml pyyaml jsonschema

      - name: Validate package manifests
        run: |
          if [ -f "scripts/ci/validate_packages.py" ]; then
            python scripts/ci/validate_packages.py
          else
            echo "validate_packages.py not found, skipping"
          fi

      - name: Check package versions
        run: |
          if [ -f "scripts/ci/check_package_versions.py" ]; then
            python scripts/ci/check_package_versions.py
          else
            echo "check_package_versions.py not found, skipping"
          fi

      - name: Validate dependencies
        run: |
          if [ -f "scripts/ci/validate_dependencies.py" ]; then
            python scripts/ci/validate_dependencies.py
          else
            echo "validate_dependencies.py not found, skipping"
          fi

  # Test package compatibility
  test-compatibility:
    name: Package Compatibility Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-set:
          - web
          - database
          - data-science
          - tui
          - utils
          - testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUL
        run: cargo build --release

      - name: Test ${{ matrix.package-set }} packages
        run: |
          if [ -d "packages/${{ matrix.package-set }}" ]; then
            for package in packages/${{ matrix.package-set }}/*; do
              if [ -d "$package" ] && [ -f "$package/Cargo.toml" ]; then
                echo "::group::Testing $(basename $package)"
                cd "$package"
                cargo test --all-features || echo "Tests failed for $(basename $package), continuing"
                cd -
                echo "::endgroup::"
              fi
            done
          else
            echo "Package category packages/${{ matrix.package-set }} not found, skipping"
          fi

      - name: Test cross-package compatibility
        run: |
          if [ -d "packages/${{ matrix.package-set }}" ] && [ -f "scripts/ci/test_package_compatibility.py" ]; then
            python scripts/ci/test_package_compatibility.py --category ${{ matrix.package-set }} || echo "Cross-package compatibility test failed for ${{ matrix.package-set }}, continuing"
          else
            echo "Skipping cross-package compatibility (missing directory or script)"
          fi

  # Test all gul_packages
  test-gul-packages:
    name: Test GUL Standard Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUL compiler
        run: cargo build --release

      - name: Test all gul_packages
        run: |
          if [ -d "gul_packages" ]; then
            for package in gul_packages/*; do
              if [ -d "$package" ]; then
                echo "::group::Testing GUL package: $(basename $package)"
                ./target/release/gul test "$package" || echo "Package test failed for $(basename $package), continuing"
                echo "::endgroup::"
              fi
            done
          else
            echo "gul_packages directory not found, skipping"
          fi

      - name: Generate compatibility report
        run: |
          if [ -f "scripts/ci/generate_compatibility_report.py" ]; then
            python scripts/ci/generate_compatibility_report.py
          else
            echo "Compatibility report script not found, skipping"
          fi

  # Package installation tests
  test-installation:
    name: Package Installation Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUL
        run: cargo build --release

      - name: Test package installation
        run: |
          echo "Package install/remove subcommands not yet implemented, skipping"
          # Future: gul install http, gul install database, etc.

  # Performance regression tests
  package-benchmarks:
    name: Package Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run package benchmarks
        run: |
          found=false
          for package in packages/*/*; do
            if [ -d "$package" ] && [ -d "$package/benches" ]; then
              cd "$package"
              cargo bench --no-fail-fast || echo "Benchmark failed for $package"
              cd -
              found=true
            fi
          done
          if [ "$found" = false ]; then
            echo "No package benchmarks found, skipping"
          fi

      - name: Compare with baseline
        run: |
          if [ -f "scripts/ci/benchmark_comparison.py" ]; then
            python scripts/ci/benchmark_comparison.py
          else
            echo "Benchmark comparison script not found, skipping"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-benchmarks
          path: target/criterion
          if-no-files-found: ignore

  # Package documentation generation
  generate-package-docs:
    name: Generate Package Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate package docs
        run: |
          found=false
          for package in packages/*/*; do
            if [ -d "$package" ] && [ -f "$package/Cargo.toml" ]; then
              cd "$package"
              cargo doc --no-deps --all-features || echo "Doc generation failed for $package"
              cd -
              found=true
            fi
          done
          if [ "$found" = false ]; then
            echo "No packages with Cargo.toml found, skipping doc generation"
          fi

      - name: Generate API reference
        run: |
          if [ -f "scripts/ci/generate_api_docs.py" ]; then
            python scripts/ci/generate_api_docs.py
          else
            echo "API docs script not found, skipping"
          fi

      - name: Build documentation site
        run: |
          if [ -f "mkdocs.yml" ]; then
            pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin pymdown-extensions
            mkdocs build || echo "MkDocs build failed, continuing"
          else
            echo "mkdocs.yml not found, skipping site build"
          fi

      - name: Deploy docs (main/master branch only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
