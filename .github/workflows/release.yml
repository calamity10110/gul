name: Release Builds

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., v0.14.0-dev)"
        required: true
        default: "v0.14.0-dev"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: Build for Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/gul

      - name: Create archive
        run: |
          cd target/release
          tar czf gul-${{ github.event.inputs.version || github.ref_name }}-linux-x86_64.tar.gz gul

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gul-linux-x86_64
          path: target/release/gul-*.tar.gz

  build-windows:
    name: Build for Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked

      - name: Create archive
        shell: pwsh
        run: |
          cd target/release
          Compress-Archive -Path gul.exe -DestinationPath gul-${{ github.event.inputs.version || github.ref_name }}-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gul-windows-x86_64
          path: target/release/gul-*.zip

  build-macos:
    name: Build for macOS (Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/x86_64-apple-darwin/release/gul \
            target/aarch64-apple-darwin/release/gul \
            -output universal/gul

      - name: Create archive
        run: |
          cd universal
          tar czf ../gul-${{ github.event.inputs.version || github.ref_name }}-macos-universal.tar.gz gul

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gul-macos-universal
          path: gul-*.tar.gz

  build-raspberry-pi:
    name: Build for Raspberry Pi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            name: rpi-armv7
            gcc: arm-linux-gnueabihf
          - target: aarch64-unknown-linux-gnu
            name: rpi-arm64
            gcc: aarch64-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.gcc }} pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure cross-compilation
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.${{ matrix.target }}]
          linker = "${{ matrix.gcc }}-gcc"
          EOF

      - name: Build release
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../gul-${{ github.event.inputs.version || github.ref_name }}-${{ matrix.name }}.tar.gz gul

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gul-${{ matrix.name }}
          path: gul-*-${{ matrix.name }}.tar.gz

  build-esp32:
    name: Build for ESP32-S3 (Xtensa)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install esp-rs toolchain and build
        run: |
          # Install espup
          curl -L https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu -o espup
          chmod +x espup
          ./espup install --targets esp32s3

          # Source environment
          . $HOME/export-esp.sh

          # Navigate to ESP32 package
          if [ -d "packages/embedded/gul-esp32" ] && [ -f "packages/embedded/gul-esp32/Cargo.toml" ]; then
            cd packages/embedded/gul-esp32
            cargo +esp build --release --target xtensa-esp32s3-none-elf || echo "ESP32 build failed (experimental target)"
          else
            echo "ESP32 package not found, creating placeholder"
            mkdir -p placeholder
            echo "ESP32-S3 build requires esp-rs toolchain setup" > placeholder/README.txt
          fi

      - name: Create archive
        run: |
          if [ -f "packages/embedded/gul-esp32/target/xtensa-esp32s3-none-elf/release/gul-esp32" ]; then
            cd packages/embedded/gul-esp32/target/xtensa-esp32s3-none-elf/release
            zip gul-${{ github.event.inputs.version || github.ref_name }}-esp32s3.zip gul-esp32
          else
            mkdir -p placeholder
            echo "ESP32-S3 build not available" > placeholder/README.txt
            cd placeholder
            zip ../gul-${{ github.event.inputs.version || github.ref_name }}-esp32s3.zip README.txt
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gul-esp32s3
          path: "**/*-esp32s3.zip"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      [build-linux, build-windows, build-macos, build-raspberry-pi]
    if: github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
